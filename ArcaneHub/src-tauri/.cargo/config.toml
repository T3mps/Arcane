# Cargo intermediates land under Arcane/Intermediate/Build/, matching premake's
# objdir convention for every C++ project in this workspace
# (objdir "Intermediate/Build/<Config>-windows-x86_64-md/<Project>").
# The final exe is copied into Arcane/Binaries/<Config>-windows-x86_64-md/Hub/
# by the `stage` npm script -- see package.json.
[build]
target-dir = "../../Intermediate/Build/hub-cargo"
