; ============================================================================
; AUTHORED LAYOUT SEED -- an ACTUAL --dump-layout capture, edited to prove it.
; ============================================================================
; ArcaneEditor loads this file under --headless (EditorApp::RetargetLayoutIni)
; with io.IniFilename NULL -- never read, never written -- so this is the ONLY
; layout an offscreen run ever sees, and no run can mutate it. That is what
; makes an offscreen editor capture reproducible across machines.
;
; PROVENANCE: this is the real output of ImGui's own SaveIniSettingsToDisk,
; captured from a genuine --headless run of ReferenceProject (Task 10,
; plan-b comparator). `--dump-layout` replaces the four manual desk steps
; this file used to prescribe (run windowed, arrange, close, copy the ini)
; with one command that needs no windowed session at all:
;
;   cd bin\Debug-windows-x86_64-md\ArcaneEditor
;   ArcaneEditor.exe --project ReferenceProject --headless --backend dx12 ^
;     --frames 30 --dump-layout dumped-layout.ini
;
; Every [Window] / [Docking][Data] entry below names a window ArcaneEditor
; actually submits (EditorDockHost, Outliner, Inspector, Material, Assets,
; Console, Problems, Viewport -- plus ImGui's own unconditional implicit
; fallback, Debug##Default, created every frame by NewFrame() itself and
; harmless to pin), with dock-node ids ImGui itself emitted -- NOT
; hand-written, unlike the placeholder this replaces. That file's SECOND
; entry (GoldenImageTest.cpp's "[golden]" case greps for its exact spelling
; and is deliberately not repeated here, to keep that regression check
; meaningful against THIS file too) named a dockspace-viewport-flavoured
; window that does NOT exist in this editor at all -- confirmed by dumping a
; run with NO seed on disk at all and finding no such entry -- so
; LoadIniSettingsFromDisk applied nothing for it and the "pinned layout" was
; really BuildDefaultLayout (EditorPanels.cpp) every run. (The FIRST
; --dump-layout capture taken while authoring THIS file still carried that
; same ghost, verbatim, because the old placeholder was still the seed on
; disk at the time -- ImGui keeps an unclaimed [Window] entry from whatever
; it loaded and re-emits it untouched on save. A second, no-seed re-dump is
; what caught it; this file is built from THAT clean capture, not the
; tainted first one.)
;
; DELIBERATELY NOT the bare dump, though. A raw --dump-layout capture off an
; UNSEEDED run is BuildDefaultLayout's own output -- ImGui built it fresh on
; frame 1 because no prior dock state existed to load (EndDockSpace's
; `DockBuilderGetNode(dockspaceId) == nullptr` branch) -- so it would be
; byte-for-byte what a run with NO seed at all also produces. A test that
; asserts "the seed was applied" would pass either way, which is exactly the
; placeholder's failure wearing a passing test. So this file's Inspector dock
; node (id 0x00000004) was widened from BuildDefaultLayout's 231px to 460px,
; with its sibling (id 0x00000003, which carries Viewport + the Assets/
; Console/Problems tabs) narrowed to 588px to compensate (588 + 460 = 1048,
; their parent's own SizeRef) -- a visible, deliberate departure from the
; built-in default. A run that loads THIS file and a run that falls back to
; BuildDefaultLayout (seed missing, or ignored) render different pictures;
; GoldenImageTest.cpp's with-seed/without-seed screenshot comparison is the
; proof, and the [golden] text case below is the cheap, no-GPU guard that
; this file keeps naming real windows going forward.
;
; TO REGENERATE: temporarily move this file aside FIRST (an already-tainted
; seed re-dumps its own unclaimed ghost entries verbatim, as above), run the
; --dump-layout command above, re-apply whatever visible edit distinguishes
; the result from BuildDefaultLayout (widening a different panel is fine --
; the point is ONE deliberate, visible departure), and copy the result over
; this file, KEEPING this header, then commit.
; ============================================================================

