; ============================================================================
; PLACEHOLDER -- NOT AN AUTHORED LAYOUT. AWAITING A DESK SESSION.
; ============================================================================
; This file is the committed layout seed ArcaneEditor loads under --offscreen
; (EditorApp::RetargetLayoutIni). Under that flag io.IniFilename is NULL --
; never read, never written -- so this is the ONLY layout an offscreen run
; sees, and no run can mutate it. That is what makes an offscreen editor
; capture reproducible across machines.
;
; WHAT IT IS NOT: it is NOT the output of ImGui's own SaveIniSettingsToDisk on
; a layout a human arranged. The authoring step (task-11-brief.md Step 4 --
; "run the editor windowed once, arrange the panels a verification run should
; see, and copy the resulting ini here") could not be performed: windowed runs
; are barred on this machine by the NVIDIA driver fault under the live Parsec
; session, and the user has ruled that windowed work waits for a physical-desk
; session. Hand-writing dock-node ids/sizes that ImGui has never emitted would
; produce a file that LOOKS authoritative and is not, so nothing of the sort
; was attempted.
;
; WHAT IT DOES TODAY: the two entries below are the minimum that is both valid
; and honest -- ImGui's own defaults for the two singleton windows every editor
; frame submits. Every panel therefore lands on its built-in default position,
; which is deterministic (the point) but is not the arranged layout a reviewer
; would want to see.
;
; TO AUTHOR IT FOR REAL, at a desk:
;   1. ArcaneEditor.exe --project ReferenceProject          (windowed)
;   2. arrange the panels a verification run should show
;   3. close the editor (that writes the real ini)
;   4. copy %LOCALAPPDATA%\Arcane\editor\layouts\<project-guid>.ini over this
;      file, KEEPING this header comment block, and commit.
; ============================================================================

[Window][Debug##Default]
Pos=60,60
Size=400,400
Collapsed=0

[Window][DockSpaceViewport]
Pos=0,0
Size=1280,720
Collapsed=0
