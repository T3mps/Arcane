[package]
# Underscore, not hyphen: the crate name IS the shipped binary's name
# (arcane_hub.exe), and the user wants the underscore form on disk.
name = "arcane_hub"
version = "0.1.0"
description = "Arcane Hub -- engine and project launcher"
authors = ["Starworks"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise conflicts on Windows (rust-lang/cargo#8519).
name = "arcane_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# ONE Hub per user, enforced: a second launch focuses the existing window
# instead of starting a rival process. Two Hubs share the .archub state files
# last-writer-wins -- the atomic writes prevent corruption but not lost
# updates -- and a launcher's second launch means "show me the Hub" anyway
# (Unity Hub and the Epic launcher both behave this way).
tauri-plugin-single-instance = "2"
# Raw Win32 for two launcher jobs no plugin covers: claiming the taskbar
# AppUserModelID the editor shares (grouping is by AUMID, NOT by process
# parentage), and focusing a running editor's window when its project is
# launched a second time.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
# preserve_order: rename_project rewrites a project's .arcproj in place. Without
# it serde_json's object is a BTreeMap, so a round-trip alphabetises every key
# and the Hub would hand back a manifest reordered top to bottom for a one-field
# edit -- a diff the user did not ask for in a file they may have in git.
serde_json = { version = "1", features = ["preserve_order"] }
# Deleting a project goes to the RECYCLE BIN, not to remove_dir_all. A launcher
# that can erase months of work on a mis-click should hand the user the same
# undo Explorer would; this wraps the Windows shell's IFileOperation, which is
# what puts the folder somewhere it can be restored from.
trash = "5"
