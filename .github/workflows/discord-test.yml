name: Discord webhook test

# Manual check that the org's Discord CI webhook posts into this repo's forum thread,
# without running the CI matrix.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Post a test message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          THREADS: ${{ vars.DISCORD_CI_THREADS }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then echo "DISCORD_CI_WEBHOOK not set"; exit 1; fi
          thread=$(printf '%s' "$THREADS" | jq -r --arg r "${REPO#*/}" '.[$r] // empty')
          if [ -z "$thread" ]; then echo "no thread for ${REPO#*/} in DISCORD_CI_THREADS"; exit 1; fi
          jq -n --arg u "https://github.com/$REPO/actions/runs/$RUN_ID"              '{username: "GitHub Actions", embeds: [{title: "CI notifications are connected", description: "Test post from the discord-test workflow.", url: $u, color: 3447003}]}'             | curl -fsS -H "Content-Type: application/json" -d @- "${DISCORD_WEBHOOK}?thread_id=${thread}" >/dev/null
