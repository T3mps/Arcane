name: CI

# Manifold2D-style hosted windows lane: generate, build Debug+Release+Dist, run
# the full suite unfiltered. Hosted runners have no capable GPU, so [gpu]
# cases report SKIPPED with a reason (ARC_REQUIRE_BACKEND) instead of being
# filtered away unseen. The Jenkins multibranch pipeline on windows-1 is the
# full gate (3 configs, an actual GPU, the --frames scripted verify).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: arcane-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # SDL3 builds from source under the repo's v143 static-md overlay triplet
      # (~10 min) -- cache the installed tree keyed on the triplet.
      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-sdl3-static-md-${{ hashFiles('vcpkg-triplets/x64-windows-static-md.cmake') }}

      - name: Install SDL3 (vcpkg, overlay triplet)
        shell: cmd
        run: |
          set _APH_NOPAUSE=1
          call scripts\setup-vcpkg-deps.bat

      - name: Generate
        shell: cmd
        run: |
          set _APH_NOPAUSE=1
          call GenerateProjects.bat

      - name: Build Debug
        run: msbuild Arcane.slnx /p:Configuration=Debug /m /nologo /v:minimal

      - name: Build Release
        run: msbuild Arcane.slnx /p:Configuration=Release /m /nologo /v:minimal

      - name: Build Dist
        run: msbuild Arcane.slnx /p:Configuration=Dist /m /nologo /v:minimal

      # test-results/ must exist before the first reporter writes into it,
      # matching the Jenkinsfile's own `if not exist test-results mkdir`.
      - name: Prepare test-results
        run: mkdir test-results

      # Each suite runs FROM ITS OWN EXE DIRECTORY (working-directory): fixtures,
      # data/ and the staged automation-exclusions.json are all resolved relative
      # to it, and the exclusion-expiry case hard-fails if that file is missing.
      - name: Test Debug
        working-directory: bin/Debug-windows-x86_64-md/ArcaneTests
        run: .\ArcaneTests.exe -r console -r json::out=${{ github.workspace }}\test-results\arcane-debug.json

      - name: Check Debug baselines
        run: powershell -ExecutionPolicy Bypass -File scripts\check-baselines.ps1 -ReportPath "${{ github.workspace }}\test-results\arcane-debug.json" -Configuration Debug

      - name: Test Release
        working-directory: bin/Release-windows-x86_64-md/ArcaneTests
        run: .\ArcaneTests.exe -r console -r json::out=${{ github.workspace }}\test-results\arcane-release.json

      - name: Check Release baselines
        run: powershell -ExecutionPolicy Bypass -File scripts\check-baselines.ps1 -ReportPath "${{ github.workspace }}\test-results\arcane-release.json" -Configuration Release

      - name: Test Dist
        working-directory: bin/Dist-windows-x86_64-md/ArcaneTests
        run: .\ArcaneTests.exe -r console -r json::out=${{ github.workspace }}\test-results\arcane-dist.json

      - name: Check Dist baselines
        run: powershell -ExecutionPolicy Bypass -File scripts\check-baselines.ps1 -ReportPath "${{ github.workspace }}\test-results\arcane-dist.json" -Configuration Dist
