name: Linux

# Hosted Linux lane (roadmap D15; Linux port 2026-10-05, building on
# docs/research/2026-10-01-linux-gcc-clang-build-inventory.md): generate with
# premake5 gmake, build GCC 14 / Clang 19 x Debug / Release, and run
# ArcaneTests "~[gpu]" minus scripts/linux-test-exclusions.txt through
# scripts/run-linux-tests.sh (the same entry point a developer runs locally).
#
# Build order mirrors the Jenkins full gate: the engine libraries first, then
# ReferenceProject's SDK game module through arcbuild (Binaries/ReferenceGame.so,
# the module the [witness][server] cases load), THEN the hosts and the test
# exe, whose postbuild stages ReferenceProject -- Binaries/ included -- beside
# themselves. ArcaneEditor builds too (E10 spawns it); its Windows-only
# services (shell open, Recycle Bin, Visual Studio launch) report
# "unsupported on this platform" on Linux rather than act.
#
# Tests run under Xvfb with SDL's x11 video driver, so windows are real
# native windows (Window::NativeHandle is an X11 Window); Vulkan comes from
# Mesa's lavapipe.
#
# The gcc-14 Debug leg (Debug: the config whose hosts and tests enable Vulkan
# validation + sync validation) also runs the [gpu] lane on lavapipe and a
# windowed smoke on X11 and Wayland:
#   - VK_LAYER_KHRONOS_validation is built from a pinned tag
#     (scripts/build-vvl-linux.sh says why the distro 1.3.275 cannot be used:
#     its syncval ignores host timeline-semaphore waits and false-positives
#     every frame-slot reuse);
#   - lavapipe is a SOFTWARE adapter, so golden compares resolve its own
#     reference set first, ReferenceProject/Verify/References/vulkan-lavapipe/
#     (Arcane::ReferenceAdapterSet), falling through to the hardware images;
#   - scripts/linux-windowed-smoke.sh opens ArcaneRuntime and ArcaneEditor in
#     real windows (Xvfb, then a headless weston), resizes the editor, and
#     uploads every screenshot.
#
# Memory: the inventory OOM'd an 8 GB box at -j8 (the Debug ArcaneTests link
# alone is ~500 MB of output). Hosted ubuntu-24.04 runners have 4 vCPU /
# 16 GB, so the build is bounded at -j3 (MAKE_JOBS below).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: arcane-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  PREMAKE_VERSION: 5.0.0-beta8
  SDL3_VERSION: 3.2.22
  # SHA-256 of SDL3-${SDL3_VERSION}.tar.gz (the release asset below); bump
  # it together with SDL3_VERSION. Third-party downloads are verified, never
  # trusted on transport alone (roadmap D26).
  SDL3_SHA256: f29d00cbcee273c0a54f3f32f86bf5c595e8823a96b1d92a145aac40571ebfcc
  # VK_LAYER_KHRONOS_validation for the [gpu] lane: the tag and the commit it
  # must resolve to (scripts/build-vvl-linux.sh refuses any other); bump both.
  VVL_TAG: vulkan-sdk-1.4.328.0
  VVL_COMMIT: a1ff2dbc7e50828def8098c5ebf0fee10b714f85
  MAKE_JOBS: 3

jobs:
  linux:
    name: ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-14, clang-19]
        config: [Debug, Release]
        include:
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            premake_cc: gcc
          - compiler: clang-19
            cc: clang-19
            cxx: clang++-19
            premake_cc: clang
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      GPU_LANE: ${{ matrix.compiler == 'gcc-14' && matrix.config == 'Debug' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Toolchains + SDL3's X11/Wayland build deps + the Vulkan loader and
      # Mesa's lavapipe (headless Vulkan; the gcc-14 Debug leg also runs [gpu]).
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 clang-19 make cmake ninja-build pkg-config \
            libvulkan-dev mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl-dev libgl-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            xvfb xauth

      # Ubuntu 24.04 does not package SDL3: build it once, cache the install
      # prefix, then copy it into /usr/local (on the default loader path, so
      # the test exe finds libSDL3.so.0 with no LD_LIBRARY_PATH).
      - name: Cache SDL3
        id: sdl3-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/sdl3-prefix
          key: sdl3-${{ env.SDL3_VERSION }}-ubuntu-24.04-v1

      - name: Build SDL3
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 4 -o sdl3.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz"
          echo "${SDL3_SHA256}  sdl3.tar.gz" | sha256sum -c -
          tar xzf sdl3.tar.gz
          cmake -S "SDL3-${SDL3_VERSION}" -B sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-prefix" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl3-build
          cmake --install sdl3-build

      - name: Install SDL3
        run: |
          sudo cp -a "$HOME/sdl3-prefix/." /usr/local/
          sudo ldconfig
          pkg-config --modversion sdl3

      # The [gpu] lane's validation layer (see the header) and the windowed
      # smoke's tools. Same cache-then-copy shape as SDL3; the distro
      # vulkan-validationlayers package is NOT installed, so the bare library
      # name in the layer manifest resolves to this copy.
      - name: Install [gpu] + windowed packages
        if: env.GPU_LANE == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            weston xdotool imagemagick x11-utils python3

      - name: Cache Vulkan validation layer
        if: env.GPU_LANE == 'true'
        id: vvl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/vvl-prefix
          key: vvl-${{ env.VVL_COMMIT }}-ubuntu-24.04-v1

      - name: Build Vulkan validation layer
        if: env.GPU_LANE == 'true' && steps.vvl-cache.outputs.cache-hit != 'true'
        run: VVL_TAG="$VVL_TAG" VVL_COMMIT="$VVL_COMMIT" scripts/build-vvl-linux.sh "$HOME/vvl-prefix"

      - name: Install Vulkan validation layer
        if: env.GPU_LANE == 'true'
        run: |
          sudo cp -a "$HOME/vvl-prefix/." /usr/local/
          sudo ldconfig
          grep '"api_version"' /usr/local/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json

      # premake lands where Arcane::Toolchain looks for a bundled copy on POSIX
      # (ThirdParty/premake5/premake5, beside the vendored .exe), so arcbuild
      # and the [build-generator] cases resolve it exactly as on Windows.
      - name: Cache premake + dxc
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ThirdParty/premake5/premake5
            ThirdParty/tools/dxc-linux
          key: tools-${{ env.PREMAKE_VERSION }}-${{ hashFiles('scripts/fetch-premake-linux.sh', 'scripts/fetch-dxc-linux.sh') }}-v1

      - name: Fetch premake + dxc
        run: |
          PREMAKE_VERSION="$PREMAKE_VERSION" scripts/fetch-premake-linux.sh
          scripts/fetch-dxc-linux.sh

      - name: Generate
        run: |
          ThirdParty/premake5/premake5 --cc=${{ matrix.premake_cc }} gmake
          "$CXX" --version

      - name: Build engine libraries + tools
        run: |
          set -o pipefail
          mkdir -p logs
          config=$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')
          make -j"$MAKE_JOBS" config="$config" \
            ArcaneCore ArcaneAssetPipeline arccook arcbuild ArcaneClient 2>&1 | tee logs/build-engine.log

      # The SDK path an external game takes: arcbuild drives premake gmake +
      # make for ReferenceProject against this checkout as the SDK.
      - name: Build ReferenceGame (arcbuild)
        run: |
          set -o pipefail
          bin/${{ matrix.config }}-linux-x86_64-md/arcbuild/arcbuild build \
            --project ReferenceProject --config ${{ matrix.config }} --sdk "$GITHUB_WORKSPACE" \
            2>&1 | tee logs/build-referencegame.log
          ls -l ReferenceProject/Binaries/

      # The hosts (editor included), the test exe and every fixture plugin
      # (ArcaneTests' postbuild stages them beside itself).
      - name: Build hosts + tests
        run: |
          set -o pipefail
          config=$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')
          make -j"$MAKE_JOBS" config="$config" \
            ArcaneServer ArcaneRuntime ArcaneEditor ArcaneTests 2>&1 | tee logs/build-tests.log

      - name: Test (~[gpu] minus scripts/linux-test-exclusions.txt)
        env:
          SDL_VIDEODRIVER: x11
        run: |
          set -o pipefail
          mkdir -p logs
          xvfb-run -a -s "-screen 0 1920x1080x24" scripts/run-linux-tests.sh ${{ matrix.config }} \
            --rng-seed "${{ github.run_number }}" \
            -r console -r "junit::out=$GITHUB_WORKSPACE/logs/arcane-tests.junit.xml" \
            2>&1 | tee logs/tests.log

      # [gpu] on lavapipe, same exclusions. GPU cases assert
      # RenderErrorCount() == 0, which latches validation VUIDs too.
      - name: Test [gpu] (lavapipe)
        if: env.GPU_LANE == 'true'
        env:
          SDL_VIDEODRIVER: x11
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" scripts/run-linux-tests.sh --gpu ${{ matrix.config }} \
            --rng-seed "${{ github.run_number }}" \
            -r console -r "junit::out=$GITHUB_WORKSPACE/logs/arcane-tests-gpu.junit.xml" \
            2>&1 | tee logs/tests-gpu.log

      - name: Windowed smoke (X11 + Wayland)
        if: env.GPU_LANE == 'true'
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" scripts/linux-windowed-smoke.sh \
            ${{ matrix.config }} logs/windowed x11 wayland 2>&1 | tee logs/windowed-smoke.log

      - name: Upload windowed screenshots
        if: always() && env.GPU_LANE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-windowed-screenshots
          path: logs/windowed/
          if-no-files-found: ignore
          retention-days: 14

      # Crashes/hangs drop symbolized stacks under <exe dir>/diagnostics/.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.compiler }}-${{ matrix.config }}-logs
          path: |
            logs/
            bin/${{ matrix.config }}-linux-x86_64-md/ArcaneTests/diagnostics/
            bin/${{ matrix.config }}-linux-x86_64-md/ArcaneTests/*.log
            bin/${{ matrix.config }}-linux-x86_64-md/ArcaneTests/ReferenceProject/Saved/Verify/
            /tmp/arcane-witness/
          if-no-files-found: ignore
          retention-days: 14
